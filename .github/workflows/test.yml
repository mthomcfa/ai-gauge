name: test

on:
  push:
    branches: [main]
  pull_request:
    # Filters on the PR's BASE branch. Stacked PRs target the branch below
    # them rather than main, so without the second pattern they would get no
    # CI at all until they are retargeted - which is exactly when you want it
    # least.
    branches: [main, "claude/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux Qt runtime libs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
              libnss3

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check version strings are in sync
        run: python tools/check_versions.py

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
