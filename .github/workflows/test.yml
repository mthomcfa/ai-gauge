name: test

on:
  push:
    branches: [main]
  pull_request:
    # Filters on the PR's BASE branch. Stacked PRs target the branch below
    # them rather than main, so without the second pattern they would get no
    # CI at all until they are retargeted - which is exactly when you want it
    # least.
    branches: [main, "claude/**"]

# Stacked PRs now get CI and the matrix is 3 OS x 2 Python versions, so a
# rapid series of pushes would otherwise leave six superseded macOS/Windows
# jobs running per push.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
        python-version: ["3.11", "3.12"]
        # One leg away from UTC, because every runner is in UTC and a test that
        # depends on the local zone passes there by accident. A period boundary
        # is a UTC instant shown in local time, and a test that left the zone
        # unnamed asserted the UTC date: it failed on every machine in the
        # Americas and on none of these. St John's is west of UTC *and* off the
        # hour, so it also catches arithmetic that assumes whole-hour offsets.
        include:
          - os: ubuntu-22.04
            python-version: "3.11"
            tz: America/St_Johns
          # One leg that does not set QT_QPA_PLATFORM, so conftest.py's default
          # is what puts the suite on the offscreen platform - the path a plain
          # `pytest` on a desktop takes, and the one every other leg skips by
          # setting the variable itself. Windows, because a Windows desktop is
          # where seven tests failed for want of it.
          - os: windows-latest
            python-version: "3.12"
            platform_from_conftest: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux Qt runtime libs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
              libnss3

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check version strings are in sync
        run: python tools/check_versions.py

      - name: Run pytest
        if: ${{ !matrix.tz && !matrix.platform_from_conftest }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      # Separate steps rather than an empty value on the others. An empty TZ is
      # UTC to the C library on Linux and macOS but is not defined on Windows,
      # and an empty QT_QPA_PLATFORM is set, so conftest.py's setdefault would
      # leave it alone and Qt would pick the desktop platform. The point of the
      # other legs is to stay exactly as they were.
      - name: Run pytest away from UTC
        if: ${{ matrix.tz }}
        env:
          QT_QPA_PLATFORM: offscreen
          TZ: ${{ matrix.tz }}
        run: pytest -q

      - name: Run pytest with the platform left to conftest.py
        if: ${{ matrix.platform_from_conftest }}
        run: pytest -q
