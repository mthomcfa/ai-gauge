name: release

on:
  push:
    tags:
      - "v*"

# Read-only by default; only the release job (which creates the draft
# GitHub Release) gets contents: write.
permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Confirm tag matches pyproject version
        shell: bash
        run: |
          proj_version=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$proj_version" ]; then
              echo "could not find version in pyproject.toml" >&2; exit 1
          fi
          if [ "$proj_version" != "${{ steps.ver.outputs.version }}" ]; then
              echo "tag version ${{ steps.ver.outputs.version }} != pyproject.toml version $proj_version" >&2
              exit 1
          fi
          echo "Tag and pyproject agree on $proj_version"

  build:
    needs: resolve-version
    permissions:
      contents: read
      # Required by actions/attest-build-provenance to mint the signed
      # provenance attestation for the built artifact.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            archive_ext: zip
            build_cmd: ./build.ps1
          - os: ubuntu-22.04
            label: linux
            archive_ext: tar.gz
            build_cmd: ./build.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Bootstrap virtualenv (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -e .[dev]

      - name: Bootstrap virtualenv (Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e .[dev]

      - name: Install Linux Qt runtime libs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Minimum runtime libs PyQt6's xcb plugin links against on Ubuntu
          sudo apt-get install -y \
              libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
              libnss3 libxss1 libasound2 libdrm2 libgbm1 \
              libxkbfile1 libxshmfence1

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\.venv\Scripts\python.exe tools\check_versions.py
          .\.venv\Scripts\python.exe -m pytest -q

      - name: Run tests (Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/python tools/check_versions.py
          .venv/bin/python -m pytest -q

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ${{ matrix.build_cmd }}

      - name: Build (Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x ./build.sh
          ${{ matrix.build_cmd }}

      - name: Package (Windows zip + sha256)
        id: pack_win
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-version.outputs.version }}"
          $zipName = "ai-gauge-$version-windows.zip"
          $shaName = "$zipName.sha256"
          Compress-Archive -Path dist\ai-gauge -DestinationPath $zipName -Force
          $sha = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$sha *$zipName" | Out-File -Encoding ascii -FilePath $shaName
          "archive=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$shaName"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package (Linux tar.gz + sha256)
        id: pack_unix
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          version="${{ needs.resolve-version.outputs.version }}"
          archive="ai-gauge-${version}-${{ matrix.label }}.tar.gz"
          sha="${archive}.sha256"
          tar -C dist -czf "$archive" ai-gauge
          shasum -a 256 "$archive" | awk '{print $1 " *" $2}' > "$sha"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"         >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          # Only this OS's archive exists in the workspace; the matrix ext glob
          # matches exactly that one file.
          subject-path: ai-gauge-*.${{ matrix.archive_ext }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-gauge-${{ matrix.label }}
          path: |
            ai-gauge-*.${{ matrix.archive_ext }}
            ai-gauge-*.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p release
          find artifacts -mindepth 2 -type f -exec mv -t release {} +
          ls -la release

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: AI Gauge ${{ needs.resolve-version.outputs.version }}
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Highlights

            _Replace this section with 3-5 user-facing highlights for this release before publishing the draft._

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ needs.resolve-version.outputs.tag }}/CHANGELOG.md) for full notes.

            **Downloads** (pick the artifact for your OS, extract, and run):
            - Windows: `ai-gauge-${{ needs.resolve-version.outputs.version }}-windows.zip`, run `ai-gauge.exe`
            - Linux:   `ai-gauge-${{ needs.resolve-version.outputs.version }}-linux.tar.gz`, run `./ai-gauge/ai-gauge`

            **Verify:** SHA256 sums live next to each archive. Each build also
            carries a signed provenance attestation — verify it with:
            `gh attestation verify <archive> --repo ${{ github.repository }}`

            Windows builds are not Authenticode-signed, so SmartScreen may warn
            on first launch; see the README for the first-launch steps.
          files: release/*
