name: Bug report
description: Crash, UI glitch, refresh problem, or other unexpected behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real cookies, GitHub PATs, or account-identifying
        log lines. Redact them as `<redacted>` if needed. **Copy diagnostics**
        already redacts email addresses and truncates scraped page text.
  - type: markdown
    attributes:
      value: |
        **This is [mthomcfa/ai-gauge](https://github.com/mthomcfa/ai-gauge), a
        security-hardened fork of
        [jpajak/ai-gauge](https://github.com/jpajak/ai-gauge).** The two share
        release numbers but not code. Please report bugs in *this* fork here;
        if you can reproduce the same bug on a clean upstream checkout, it is
        worth reporting there too.
  - type: input
    id: version
    attributes:
      label: AI Gauge version
      description: |
        The **full** string, including the `+cfa.N` suffix — a bare number is
        ambiguous between this fork and upstream. Find it in the panel header,
        the tray tooltip, or the `app_version` field of **Copy diagnostics**.
      placeholder: "e.g. 0.6.5+cfa.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11 23H2, macOS 15.4, Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running AI Gauge?
      options:
        - Standalone release build
        - From source (`python -m aigauge`)
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        Logs live in the per-OS app-data directory as `ai-gauge.log`. Paste
        only the relevant excerpt and redact any cookie/token values.
      render: text
