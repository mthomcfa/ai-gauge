name: Provider layout broken
description: Claude or Codex tile shows `error · layout changed` or empty values after a provider UI update.
labels: [provider-layout]
body:
  - type: markdown
    attributes:
      value: |
        AI Gauge scrapes the Claude.ai, ChatGPT Codex, and OpenCode usage
        pages. When those pages change shape, the page-extractor JS in
        `src/aigauge/providers/{claude,codex,opencode_go}.py` needs adjusting.
        These reports are very welcome.

        This is a fork of [jpajak/ai-gauge](https://github.com/jpajak/ai-gauge)
        and its extractors have diverged from upstream's, so a layout fix here
        may not match one made there.

        **Do not paste your `Cookie:` header.** Paste only the diagnostic
        details below.
  - type: dropdown
    id: provider
    attributes:
      label: Which provider tile is broken?
      options:
        - Claude.ai
        - ChatGPT Codex
        - OpenCode
        - More than one
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI Gauge version
      description: |
        The **full** string, including the `+cfa.N` suffix — a bare number is
        ambiguous between this fork and upstream. Find it in the panel header,
        the tray tooltip, or the `app_version` field of **Copy diagnostics**.
      placeholder: "e.g. 0.6.5+cfa.1"
    validations:
      required: true
  - type: textarea
    id: tile-text
    attributes:
      label: Exact text shown on the tile
      placeholder: "e.g. error · layout changed"
    validations:
      required: true
  - type: textarea
    id: error-dialog
    attributes:
      label: Click the tile error and copy the raw payload
      description: |
        Click the error label on the tile to open the details dialog, hit Copy,
        and paste it here. Redact any URLs that look user-specific.
      render: text
  - type: textarea
    id: page-state
    attributes:
      label: What does the actual provider page look like right now?
      description: |
        Open the same URL in your normal browser and describe (or screenshot)
        what's there. New "Plan usage limits" header? Different chart? Banner?
        That description is what makes the fix tractable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        From `ai-gauge.log` in the per-OS app-data directory. Look for
        `provider=claude`, `provider=codex` or `provider=opencode_go` lines
        around the failed refresh.
      render: text
