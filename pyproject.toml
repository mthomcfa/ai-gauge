[project]
name = "ai-gauge"
version = "1.0.0+cfa.2"
description = "Compact always-on-top monitor for Claude.ai, ChatGPT Codex, and GitHub Copilot usage limits."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AI Gauge maintainers" }]
keywords = ["ai", "desktop", "usage-monitor", "claude", "codex", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.7,<7",
    "PyQt6-WebEngine>=6.7,<7",
    "requests>=2.32",
    "pydantic>=2.6",
    "keyring>=25.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/mthomcfa/ai-gauge"
Repository = "https://github.com/mthomcfa/ai-gauge"
Issues = "https://github.com/mthomcfa/ai-gauge/issues"
Security = "https://github.com/mthomcfa/ai-gauge/security"
Changelog = "https://github.com/mthomcfa/ai-gauge/blob/main/CHANGELOG.md"
Upstream = "https://github.com/jpajak/ai-gauge"

# This tree is a security-hardening fork. It was audited and patched starting
# from the upstream commit recorded below; downstream builds should be produced
# from this fork, not the upstream unsigned releases.
#
# Versioning: the release number before "+" is this fork's own counter, not a
# claim about which upstream release this matches. Upstream numbers of the same
# value exist and are different code. The "+cfa.N" local segment (PEP 440) is
# what makes a fork build unambiguous. See "Versioning" in README.md.
[tool.ai-gauge-audit]
upstream_repo = "https://github.com/jpajak/ai-gauge"
fork_repo = "https://github.com/mthomcfa/ai-gauge"
audited_upstream_commit = "1df4536"
audited_upstream_tag = "v0.6.3"
fork_local_segment = "cfa"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "responses>=0.25",
    "pyinstaller>=6.6",
]

[project.scripts]
ai-gauge = "aigauge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigauge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
